name: Service directory refresh
on:
  schedule:
    - cron: "21 23 * * *" # 08:21 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "service-directory/seed.json"
      - "service-directory/sync.py"
      - "*/service-entry.json"
  pull_request:
    paths:
      - "service-directory/**"
      - ".github/workflows/service-directory.yml"
permissions:
  contents: read
concurrency:
  group: service-directory-refresh
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate first-party records and opt-outs
        run: python service-directory/sync.py --dry-run --no-network
  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check HTTP status and regenerate catalog
        run: python service-directory/sync.py
      - name: Commit only when data changed
        run: |
          if ! git diff --quiet -- service-directory/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add service-directory/catalog.json
            git commit -m "chore: update service directory health ledger"
            git push
          fi
