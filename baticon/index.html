<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f22"><title>バチコン第14回｜まいこ共有用・二人作戦</title><style>html,body{margin:0;min-height:100%;background:#071f22;color:#f4efe5;font:700 16px/1.7 system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}b{color:#f4c34f}</style></head><body><main id="boot"><div><b>バチコン第14回</b><br>二人作戦を展開中…</div></main><script type="module">
try {
  if (!('DecompressionStream' in window)) throw new Error('unsupported');
  const parts = await Promise.all([0,1,2,3].map(i => fetch(`payload/${i}.txt?v=roles-20260829`).then(r => {
    if (!r.ok) throw new Error(`payload ${i}`);
    return r.text();
  })));
  const bytes = Uint8Array.from(atob(parts.join('')), c => c.charCodeAt(0));
  let html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

  // Canonical gameplay hotfix. The payload is legacy; these substitutions prevent old loadouts/strategy from surviving.
  const substitutions = [
    [/バケットスロッシャー/g, 'バレルスピナー'],
    [/バケスロ/g, 'バレルスピナー'],
    [/スプラマニューバー/g, 'パラシェルター'],
    [/マニューバー/g, 'パラシェルター'],
    [/カニタンク/g, 'トリプルトルネード'],
    [/カニ2回/g, 'トリプルトルネード2回'],
    [/カニの時間/g, 'トルネの時間'],
    [/カニ中/g, 'トルネ中'],
    [/カニ以外/g, 'トルネ以外'],
    [/カニ今/g, 'トルネ今']
  ];
  for (const [from, to] of substitutions) html = html.replace(from, to);

  const canonicalStyle = `<style id="canonical-role-style">
  .canonical-loadouts{position:relative;z-index:2147483000;background:#071f22;color:#f7f0df;border-bottom:4px solid #111;padding:10px 12px 12px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 6px 0 #f4c34f}
  .canonical-loadouts *{box-sizing:border-box}.canonical-loadouts__inner{max-width:1080px;margin:auto}.canonical-loadouts__eyebrow{display:flex;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f4c34f}.canonical-loadouts__grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.canonical-role{min-width:0;padding:9px 10px;border:2px solid #111;background:#f7f0df;color:#071f22;box-shadow:4px 4px 0 #111}.canonical-role--maiko{background:#f4c34f}.canonical-role small{display:block;font-size:10px;letter-spacing:.08em}.canonical-role b{display:block;color:#071f22;font-size:clamp(15px,4.4vw,21px);line-height:1.12}.canonical-role span{display:block;font-size:11px;white-space:normal}.canonical-w2{margin:10px 0 0;padding:8px 10px;border:2px dashed #f4c34f;font-size:12px;line-height:1.35}.canonical-w2 strong{color:#f4c34f}.canonical-fact-correction{margin:0;padding:8px 12px;background:#f15a2a;color:#fff;text-align:center;font:900 12px/1.35 system-ui,sans-serif;letter-spacing:.02em}
  @media(min-width:700px){.canonical-loadouts{padding:12px 24px 14px}.canonical-loadouts__grid{gap:14px}.canonical-role{padding:12px 14px}.canonical-role b{font-size:22px}.canonical-role span,.canonical-w2{font-size:13px}}
  </style>`;
  const canonicalBanner = `<section class="canonical-loadouts" aria-label="正本の二人担当">
    <div class="canonical-loadouts__inner">
      <p class="canonical-loadouts__eyebrow"><span>CANONICAL DUO LOADOUT</span><span>第14回・正本</span></p>
      <div class="canonical-loadouts__grid">
        <article class="canonical-role canonical-role--ken"><small>ケンシロウ</small><b>バレルスピナー</b><span>ホップソナー／カゴ〜高台の固定役</span></article>
        <article class="canonical-role canonical-role--maiko"><small>まいこ</small><b>パラシェルター〈傘〉</b><span>トリプルトルネード／納品・救助・遊撃</span></article>
      </div>
      <p class="canonical-w2"><strong>W2 得点源：</strong>まいこのトリプルトルネード2回（目安 68秒・17秒）。カニ前提なし。</p>
    </div>
  </section><p class="canonical-fact-correction">ケン＝バレル　／　まいこ＝傘　／　W2はまいこのトルネ2回</p>`;

  html = html.replace(/<\/head>/i, `${canonicalStyle}</head>`);
  html = html.replace(/<body([^>]*)>/i, `<body$1>${canonicalBanner}`);
  document.open(); document.write(html); document.close();
} catch (e) {
  boot.innerHTML = '<div><b>作戦盤を展開できませんでした。</b><br>最新版のブラウザで再読み込みしてください。</div>';
}
</script></body></html>
