<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15130f"><title>BATICON GOLD RUN｜ケンシロウ × まいこ</title><style>html,body{margin:0;min-height:100%;background:#15130f;color:#f2eedb;font:700 16px/1.7 system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}b{color:#d8ff3e}</style></head><body><main id="boot"><div><b>BATICON GOLD RUN</b><br>作戦盤を展開中…</div></main><script type="module">try{if(!('DecompressionStream'in window))throw 0;const parts=await Promise.all([0,1,2,3].map(i=>fetch(`payload/${i}.txt`).then(r=>{if(!r.ok)throw 0;return r.text()})));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){boot.innerHTML='<div><b>展開できませんでした。</b><br>最新版のブラウザで再読み込みしてください。</div>'}</script></body></html>
