<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>僕の惑星 — URL母艦 pilot</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color-scheme:dark}
    body{margin:0;background:#101917;color:#f3f0e8}
    main{max-width:760px;margin:auto;padding:24px 16px 64px}
    h1{font-size:clamp(28px,8vw,52px);margin:.2em 0}.note{color:#b7c1bb;line-height:1.7}
    input{box-sizing:border-box;width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:1px solid #51615a;background:#17231f;color:inherit}
    nav{display:flex;gap:8px;overflow:auto;padding:14px 0}button{font:inherit;color:inherit;background:#21312b;border:1px solid #51615a;border-radius:999px;padding:9px 12px}
    button[aria-pressed="true"]{background:#f3f0e8;color:#101917}.grid{display:grid;gap:10px}.card{border:1px solid #34443d;border-radius:16px;padding:14px;background:#14201c}
    .top{display:flex;justify-content:space-between;gap:12px}.kind{font-size:12px;color:#9fb0a8}.actions{display:flex;gap:6px;flex-wrap:wrap}.open{display:inline-block;color:#101917;background:#f3f0e8;text-decoration:none;padding:10px 13px;border-radius:10px;font-weight:700}
    .empty{padding:24px 0;color:#9fb0a8}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main>
  <p class="kind">PERSONAL SURFACE · BOUNDED PILOT</p>
  <h1>あとで、ここから。</h1>
  <p class="note">チャットや別ポータルに散ったURLを、正式登録前の候補として拾う確認版。★と📌と履歴はこのブラウザだけに保存します。</p>
  <input id="q" type="search" placeholder="名前・用途・タグで探す" autocomplete="off">
  <nav aria-label="表示"><button data-mode="all" aria-pressed="true">すべて</button><button data-mode="pins">📌 固定</button><button data-mode="favorites">★ お気に入り</button><button data-mode="recent">最近</button></nav>
  <div id="list" class="grid" aria-live="polite"></div>
</main>
<script src="personal-state.js"></script>
<script>
(async()=>{
 const res=await fetch("discovery-candidates.json",{cache:"no-store"}), data=await res.json();
 const items=data.items||[], q=document.querySelector("#q"), list=document.querySelector("#list");
 let mode="all";
 const norm=s=>(s||"").toLowerCase();
 function state(){return window.BokuPersonalSurface.get()}
 function filtered(){
  const s=state(), needle=norm(q.value);
  return items.filter(x=>{
   if(mode==="pins"&&!s.pins.includes(x.id))return false;
   if(mode==="favorites"&&!s.favorites.includes(x.id))return false;
   if(mode==="recent"&&!s.recent.includes(x.id))return false;
   return !needle||norm([x.title,x.kind,x.status,...(x.tags||[])].join(" ")).includes(needle);
  }).sort((a,b)=>{
   const s=state(), ap=s.pins.indexOf(a.id), bp=s.pins.indexOf(b.id);
   return (ap<0?999:ap)-(bp<0?999:bp);
  });
 }
 function render(){
  const s=state(), rows=filtered();
  list.innerHTML=rows.length?"":'<p class="empty">まだありません。</p>';
  rows.forEach(x=>{
   const el=document.createElement("article");el.className="card";
   el.innerHTML='<div class="top"><div><strong></strong><div class="kind"></div></div><div class="actions"><button class="fav"></button><button class="pin"></button></div></div><p class="kind tags"></p><a class="open">開く ↗</a>';
   el.querySelector("strong").textContent=x.title;
   el.querySelector(".kind").textContent=x.kind+" · "+x.status;
   el.querySelector(".tags").textContent=(x.tags||[]).join(" · ");
   const fav=el.querySelector(".fav"), pin=el.querySelector(".pin"), open=el.querySelector(".open");
   fav.textContent=s.favorites.includes(x.id)?"★":"☆"; fav.setAttribute("aria-label","お気に入り");
   pin.textContent=s.pins.includes(x.id)?"📌":"＋📌"; pin.setAttribute("aria-label","固定");
   fav.onclick=()=>{window.BokuPersonalSurface.toggleFavorite(x.id);render()};
   pin.onclick=()=>{window.BokuPersonalSurface.togglePin(x.id);render()};
   open.href=x.url; open.onclick=()=>window.BokuPersonalSurface.recordOpen(x.id);
   list.append(el);
  });
 }
 q.addEventListener("input",render);
 document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()});
 render();
})().catch(e=>{document.querySelector("#list").textContent="候補を読み込めませんでした。";console.error(e)});
</script>
</body>
</html>
